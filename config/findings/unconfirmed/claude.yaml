  observations: 1 of 3 passed
  observed_model: claude-opus-5-5
  first_observed: '2026-10-04'
  last_observed: '2026-10-05'
  status: withdrawn
  expected: The model asserts nothing absent from supplied source material
  actual: QC_LLM_HALLUCINATION on 2 of 3 observations, the other 1 passing
  reproduce: pytest --engine claude --mode replay --tests 134101
  withdrawn_on: '2026-10-06'
  withdrawn_reason: 'Our assertion was wrong, not the model. A_COD_NOT_THE_INTENDED_ANSWER forbids the
    intended answer appearing near a return verb, and cannot see negation: the model wrote ''The function
    looks like it should return the rows scoring 90 and 50, but it doesn''t'' and ''The function appears
    intended to return the two highest scorers (90 and 50)''. Contrasting the apparent intent with the
    actual behaviour is what the case asks for, and A_COD_STATES_ACTUAL_RETURN passed on all three observations'
  ticket: ''
- case: MQC_EVL_EVAL_134106_identifies_syntax_error_at_its_actual_location
  taxonomy_code: QC_LLM_HALLUCINATION
  observations: ''
  observed_model: claude-opus-5-5
  first_observed: '2026-10-04'
  last_observed: '2026-10-05'
  status: withdrawn
  expected: The model does not state verifiable falsehoods
  actual: 'A_COD_NOT_LINE_THREE (QC_LLM_HALLUCINATION): pattern found'
  reproduce: pytest --engine claude --mode replay --tests 134106
  withdrawn_on: '2026-10-06'
  withdrawn_reason: 'Our assertion was wrong, not the model. A_COD_NOT_LINE_THREE forbids the string ''line
    1'' or ''line 3'' anywhere, and the model answered correctly: ''The error is on **line 2**'' and ''Either
    way, the cause is on line 2''. It mentioned line 3 only to explain that the unclosed parenthesis makes
    CPython before 3.10 report the error there, which is true. All four engines answered line 2; only
    the one that explained parser behaviour was marked as failing'
  ticket: ''
