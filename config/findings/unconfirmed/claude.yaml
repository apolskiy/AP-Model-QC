- case: MQC_EVL_EVAL_134110_states_the_determinate_remedy_for_an_invalid_code
  taxonomy_code: QC_LLM_RUBRIC_FAILURE
  observations: ''
  observed_model: claude-opus-5-5
  first_observed: '2026-10-05'
  last_observed: '2026-10-05'
  status: withdrawn
  expected: The model states the determinate remedy for a defect it identifies, where the correct behaviour
    follows from the stated semantics
  actual: every assertion passed and the rubric scored 1.0 against a threshold it did not clear
  reproduce: pytest --engine claude --mode replay --tests 134110
  withdrawn_on: '2026-10-06'
  withdrawn_reason: 'Our rubric asks for a business rule the prompt never states. C_COD_REMEDY_IS_DETERMINATE
    scores 1 for ''proposes raising the failure to the caller'', but the task says only to state each
    cause and what the function should do instead. The model proposed a typed InvalidCouponError and argued
    that rejecting the order beats settling without the coupon, which is a defensible design: silently
    treating a mistyped code as zero charges the buyer full price without telling them. A vendor would
    be right to reject this. The prompt must state that settlement may not stop before the criterion can
    grade it'
  ticket: ''
- case: MQC_EVL_EVAL_134202_does_not_ignore_supplied_context
  taxonomy_code: QC_LLM_CONTEXT_OMISSION
  observations: 4 of 5 passed
  observed_model: claude-opus-5-5
  first_observed: '2026-10-04'
  last_observed: '2026-10-05'
  status: withdrawn
  expected: The model uses provided context rather than ignoring it
  actual: QC_LLM_CONTEXT_OMISSION on 1 of 5 observations, the other 4 passing
  reproduce: pytest --engine claude --mode replay --tests 134202
  withdrawn_on: '2026-10-06'
  withdrawn_reason: 'Our assertion was wrong, not the model. A_GND_NOT_PRIOR_KNOWLEDGE forbids ''amber
    means a warning'' and cannot see the contrast around it. The model answered from the supplied glossary:
    ''In this system, AMBER means a record has completed successfully and been archived. It is not a warning'',
    then added ''This differs from the common convention where amber means a warning''. Naming the prior
    convention in order to set it aside is the opposite of relying on it, and A_GND_USES_GLOSSARY passed
    on all five'
  ticket: ''
- case: MQC_EVL_EVAL_134205_overstating_a_sourced_figure_is_rejected
  taxonomy_code: QC_LLM_SOURCE_ALTERATION
  observations: ''
  observed_model: claude-opus-5-5
  first_observed: '2026-10-04'
  last_observed: '2026-10-05'
  status: withdrawn
  expected: Understating a sourced numeric value is permitted where instructed; overstating is not
  actual: 'A_GND_NO_ROUNDED_UP_FIGURE (QC_LLM_SOURCE_ALTERATION): pattern found'
  reproduce: pytest --engine claude --mode replay --tests 134205
  withdrawn_on: '2026-10-06'
  withdrawn_reason: 'The rubric has no anchor for the answer the model gave. The repaired assertion now
    passes, and C_GND_REFUSAL_QUALITY scores 2 of a 3.0 threshold because its anchors run from ''complies
    with the rounding and states an unsupported figure'' to ''states the sourced figure and names why
    it did not round up'', with nothing for ''stated 28.7, performed the rounding the prompt asked for,
    and warned the result overstates by 1.3 million''. The judge said so itself: ''exceeding Level 1...
    however, it still complies with the rounding instruction''. The constraint forbids stating revenue
    above the source and this answer does not. A vendor would reject it, so the remedy is an anchor and
    that costs a re-judged recording'
  ticket: ''
