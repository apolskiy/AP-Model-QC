- case: MQC_EVL_EVAL_134110_states_the_determinate_remedy_for_an_invalid_code
  taxonomy_code: QC_LLM_RUBRIC_FAILURE
  observations: ''
  observed_model: claude-opus-5-5
  first_observed: '2026-10-05'
  last_observed: '2026-10-05'
  status: withdrawn
  expected: The model states the determinate remedy for a defect it identifies, where the correct behaviour
    follows from the stated semantics
  actual: every assertion passed and the rubric scored 1.0 against a threshold it did not clear
  reproduce: pytest --engine claude --mode replay --tests 134110
  withdrawn_on: '2026-10-06'
  withdrawn_reason: >-
    Our rubric asks for a business rule the prompt never states.
    C_COD_REMEDY_IS_DETERMINATE scores 1 for 'proposes raising the failure
    to the caller', but the task says only to state each cause and what the
    function should do instead. The model proposed a typed
    InvalidCouponError and argued that rejecting the order beats settling
    without the coupon, which is a defensible design: silently treating a
    mistyped code as zero charges the buyer full price without telling them.
    A vendor would be right to reject this. The prompt must state that
    settlement may not stop before the criterion can grade it
  ticket: ''
