[pytest]
# The discovery overrides match the harness exactly, and that is a requirement
# rather than a convenience: the MQC naming convention is normative in
# test_taxonomy.md section 2.1, which lives in the harness repository and is not
# duplicated here. Two spellings of one convention would drift.
testpaths = tests
python_files = mqc_*.py
python_classes = TestMQC*
python_functions = MQC_*

# --rtm NAMES THIS REPOSITORY'S MATRIX, which --family and --requirement
# resolve through. The harness owns no case matrix and has no default to
# fall back to, so the path is supplied here once rather than on every
# invocation. It is not a selector and does not make a run manual.
# --case-index MAKES --family EXACT AND --tag POSSIBLE. The matrix is keyed
# by requirement, so resolving a family through it selects the whole row;
# the index is one row per case. Generated by tools/case_index.py.
addopts = -v --tb=short --rtm docs/testing/rtm_model.csv
          --case-index docs/testing/case_index.csv

# The full layer registry, even though this repository currently exercises only
# some of it. A marker the suite does not register is a pytest warning, and the
# graded layers land here as cases are written.
markers =
    unit: Harness preconditions owned by this repository, such as fixture guards
    system: Multi-model dispatch and integration pipeline tests
    evaluator: LLM-as-a-Judge rubric and scoring tests
    tool: Tool-use compliance - required tools invoked, forbidden tools avoided
    sec: Model security behaviour - injection resistance, prompt leakage, tool coercion
    base: Foundational test - dependents do not execute if this fails
    depends_on: Names the five-digit identifiers this case presupposes
    priority: Test priority P0-P4; P0/P1 must pass for a green run
