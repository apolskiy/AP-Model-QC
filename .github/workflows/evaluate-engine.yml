# SPDX-FileCopyrightText: 2026 Aleksandr Polskiy
# SPDX-License-Identifier: MIT
# The regression run for ONE engine: the live runs, banded as the gate is.
#
# Specified by docs/design/consumer_ci.md sections 7.9, 7.8 and 4.18.
#
# A REGRESSION RUN MEASURES AN EVAL ENGINE, and nothing else (section 7.9):
#
#   preconditions   this repository's unit tests, so the cases are known to work
#   calibration     the judge's calibration is green and covers the model it
#                   serves now; checked, never run (section 7.9.3)
#   live -> live    P0 and P1 release blocking, P2-P4 against the pass floor
#
# NO REPLAY RUNS HERE, since 2026-11-14. replay -> replay is a machinery check
# and runs in every gate; the judge is certified by calibrate-judge.yml. A red
# replay stage stopped the live bands, so a new model's fixes were never
# measured.
#
# EACH BAND CARRIES ITS OUTCOMES TO THE NEXT, so a dependent of a failed
# foundation skips before its candidate is dispatched, and each spends what the
# bands before it left of one ceiling. Sections 7.8.2 and 7.8.4.
#
# ONE ENGINE PER CALL, AND NOTHING AGGREGATES. These are the products of
# different companies evaluated against one harness: a combined result
# is an average over four vendors, which answers no question anybody asks.
# Section 4.18.
name: evaluate-engine

on:
  workflow_call:
    inputs:
      max_spend:
        description: >-
          USD ceiling for the whole regression run. Each live band spends what the live
          bands before it left (section 7.8.4)
        required: false
        default: "7.00"
        type: string
      engine:
        description: "Which engine the regression run evaluates"
        required: true
        type: string
      judge:
        description: >-
          Which engine grades the live bands. Its calibration is checked before
          any band spends (section 7.9.3)
        required: false
        default: "gemini"
        type: string
      os:
        description: >-
          The one platform every job running the suite takes. A live run
          measures the model and the judge, which no platform changes; the
          gate tests the harness on both (section 7.8.3)
        required: false
        default: "ubuntu-26.04"
        type: string

permissions:
  contents: read
  actions: read

env:
  PYTHON_VERSION: "3.14"

jobs:
  # IT MEASURES NOTHING; it decides whether the regression run has an
  # instrument worth spending on. ONE RESOLVE FOR EVERY JOB, so the harness
  # cannot move between the checks and the bands. Section 7.6.
  resolve:
    name: resolve the paired harness
    runs-on: ubuntu-26.04
    outputs:
      harness_repository: ${{ steps.pin.outputs.harness_repository }}
      harness_sha: ${{ steps.pin.outputs.harness_sha }}
      green: ${{ steps.pin.outputs.green }}
      reason: ${{ steps.pin.outputs.reason }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # PYYAML, AND NOTHING ELSE, BECAUSE THE HARNESS MUST NOT BE HERE. The
      # resolver decides whether the paired harness is verified, and installing
      # that harness to make the decision would ask an unverified ref to vouch
      # for itself. The version matches the `pyyaml` pin in `pyproject.toml`.
      - name: Install PyYAML for the resolver
        run: python -m pip install --quiet "pyyaml>=6.0,<7.0"

      - name: Resolve the pairing and assess it
        id: pin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m tools.harness_pin --case-branch "${{ github.ref_name }}"

      - name: Say what the regression run is about to measure with
        if: always()
        shell: bash
        run: |
          {
            echo "## Harness pairing"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Harness commit | ${{ steps.pin.outputs.harness_sha }} |"
            echo "| Gate green | ${{ steps.pin.outputs.green }} |"
            echo ""
            echo "${{ steps.pin.outputs.reason }}"
          } >> "$GITHUB_STEP_SUMMARY"

  # THIS REPOSITORY'S UNIT TESTS AHEAD OF EVERY BAND, so the cases are known to
  # work before they run live. A red here means nothing was measured and
  # nothing was spent. It writes the record every band reads, guarded by both
  # commits and the platform, so it runs on the chosen one. Sections 7.2.1
  # and 7.8.3; harness `cmn_verdict_and_cli.md` section 7.1.4.
  preconditions:
    name: preconditions, not a model finding (${{ inputs.engine }}, ${{ inputs.os }})
    needs: resolve
    if: needs.resolve.outputs.green == 'true'
    runs-on: ${{ inputs.os }}
    env:
      MQC_CODE_REF: ${{ needs.resolve.outputs.harness_sha }}
      MQC_CASE_REF: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install the resolved harness and this repository
        shell: bash
        run: |
          python -m pip install --quiet \
            "ap-harness-qc[dev] @ git+https://github.com/${{ needs.resolve.outputs.harness_repository }}@${{ needs.resolve.outputs.harness_sha }}"
          python -m pip install --quiet --no-deps --editable "."

      - name: Gate 2, the corpus preconditions
        run: pytest -m unit --preconditions-record reports/preconditions.json --junitxml=reports/junit_mqc_unit.xml --alluredir=reports/allure-results

      - name: Carry the precondition record to the bands
        uses: actions/upload-artifact@v6
        with:
          name: preconditions-${{ inputs.engine }}
          path: reports/preconditions.json
          if-no-files-found: error
          retention-days: 1

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: mqc-reports-cases-${{ inputs.engine }}-preconditions
          path: reports/
          retention-days: 90

  # THE JUDGE'S CALIBRATION IS CHECKED, NEVER RUN. The latest completed
  # calibrate-<judge>.yml run on the default branch must have succeeded, and
  # the record at the head of the default branch must cover the judge as it
  # serves now. Either failing stops the run with exit 3 before any band
  # spends: an instrument problem, not a model finding. It names `live` for
  # the judge's key, which asking what the judge serves needs. Section 7.9.3.
  calibration:
    name: calibration check, not a model finding (judge ${{ inputs.judge }})
    needs: resolve
    if: needs.resolve.outputs.green == 'true'
    runs-on: ${{ inputs.os }}
    environment: live
    env:
      MQC_CODE_REF: ${{ needs.resolve.outputs.harness_sha }}
      MQC_CASE_REF: ${{ github.sha }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install the resolved harness and this repository
        shell: bash
        run: |
          python -m pip install --quiet \
            "ap-harness-qc[dev] @ git+https://github.com/${{ needs.resolve.outputs.harness_repository }}@${{ needs.resolve.outputs.harness_sha }}"
          python -m pip install --quiet --no-deps --editable "."
      - name: How the judge's latest calibration run concluded
        id: latest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          conclusion="$(gh run list --repo "${{ github.repository }}" \
            --workflow "calibrate-${{ inputs.judge }}.yml" \
            --branch "${{ github.event.repository.default_branch || 'main' }}" \
            --status completed --limit 1 --json conclusion --jq '.[0].conclusion // ""')"
          echo "conclusion=$conclusion" >> "$GITHUB_OUTPUT"
      - name: Take the judge's calibration record from the default branch
        shell: bash
        run: |
          mkdir -p calibration
          git fetch --quiet --depth=1 origin "${{ github.event.repository.default_branch || 'main' }}"
          git show "FETCH_HEAD:records/calibration/${{ inputs.judge }}.json" > calibration/record.json || rm -f calibration/record.json
      - name: Check the judge is calibrated
        shell: bash
        run: python -m tools.calibration_ready --judge "${{ inputs.judge }}" --record calibration/record.json --conclusion "${{ steps.latest.outputs.conclusion }}"

  # LIVE -> LIVE: BOTH SIDES LIVE, THE ONLY SOURCE OF A FINDING ABOUT THE
  # MODEL, and per A2 a model regression never blocks a merge. P0 waits on both
  # checks; each later band waits on the band before it and runs unless a
  # check failed, so a red band does not hide the next (section 7.9.2).
  live-live-p0:
    name: live -> live on ${{ inputs.engine }}, P0, release blocking, judged by ${{ inputs.judge }}
    needs: [resolve, preconditions, calibration]
    runs-on: ${{ inputs.os }}
    environment: live
    env:
      MQC_CODE_REF: ${{ needs.resolve.outputs.harness_sha }}
      MQC_CASE_REF: ${{ github.sha }}
      # EVERY PROVIDER'S KEY IS OFFERED AND EACH ADAPTER READS ITS OWN, the
      # variable it declares through `credential_variables`. A leg whose key
      # is absent refuses at preflight (section 4.17.2); `MQC_CAS_UNI_115710`
      # requires a line here per rostered engine.
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install the resolved harness and this repository
        shell: bash
        run: |
          python -m pip install --quiet \
            "ap-harness-qc[dev] @ git+https://github.com/${{ needs.resolve.outputs.harness_repository }}@${{ needs.resolve.outputs.harness_sha }}"
          python -m pip install --quiet --no-deps --editable "."
      - name: Take the record the preconditions job wrote
        uses: actions/download-artifact@v7
        with:
          name: preconditions-${{ inputs.engine }}
          path: reports/
      - name: What the live bands before this one left of the ceiling
        id: spend
        shell: bash
        run: python -m tools.spend_remaining --ceiling "${{ inputs.max_spend }}" --reports spent --earlier 0 --output "$GITHUB_OUTPUT"
      - name: Take the judge's calibration record from the default branch
        shell: bash
        run: |
          mkdir -p calibration
          git fetch --quiet --depth=1 origin "${{ github.event.repository.default_branch || 'main' }}"
          git show "FETCH_HEAD:records/calibration/${{ inputs.judge }}.json" > calibration/record.json || rm -f calibration/record.json
      - name: Band P0
        uses: ./.github/actions/band
        with:
          band: P0
          priority: "0"
          report: live_live_p0
          engine: ${{ inputs.engine }}
          mode: live
          judge_mode: live
          judge_engine: ${{ inputs.judge }}
          max_spend: ${{ steps.spend.outputs.remaining }}
          calibration_record: calibration/record.json
          preconditions_record: reports/preconditions.json
          blocking: "true"
      - name: Carry the outcomes to P1
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: carry-live-live-after-p0-${{ inputs.engine }}
          path: reports/carry.json
          retention-days: 1
      - name: Publish what this band spent to the live bands after it
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: spend-${{ inputs.engine }}-live-live-p0
          path: reports/junit_mqc_live_live_p0.xml
          retention-days: 1
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: mqc-reports-cases-${{ inputs.engine }}-live-live-p0-by-${{ inputs.judge }}
          path: reports/
          retention-days: 90

  live-live-p1:
    name: live -> live on ${{ inputs.engine }}, P1, release blocking, judged by ${{ inputs.judge }}
    needs: [resolve, preconditions, calibration, live-live-p0]
    if: ${{ !cancelled() && needs.preconditions.result == 'success' && needs.calibration.result == 'success' }}
    runs-on: ${{ inputs.os }}
    environment: live
    env:
      MQC_CODE_REF: ${{ needs.resolve.outputs.harness_sha }}
      MQC_CASE_REF: ${{ github.sha }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install the resolved harness and this repository
        shell: bash
        run: |
          python -m pip install --quiet \
            "ap-harness-qc[dev] @ git+https://github.com/${{ needs.resolve.outputs.harness_repository }}@${{ needs.resolve.outputs.harness_sha }}"
          python -m pip install --quiet --no-deps --editable "."
      - name: Take the record the preconditions job wrote
        uses: actions/download-artifact@v7
        with:
          name: preconditions-${{ inputs.engine }}
          path: reports/
      - name: Take the outcomes P0 established
        uses: actions/download-artifact@v7
        with:
          name: carry-live-live-after-p0-${{ inputs.engine }}
          path: reports/
      - name: Take the reports of the live bands before this one
        uses: actions/download-artifact@v7
        with:
          pattern: spend-${{ inputs.engine }}-*
          path: spent/
          merge-multiple: true
      - name: What the live bands before this one left of the ceiling
        id: spend
        shell: bash
        run: python -m tools.spend_remaining --ceiling "${{ inputs.max_spend }}" --reports spent --earlier 1 --output "$GITHUB_OUTPUT"
      - name: Take the judge's calibration record from the default branch
        shell: bash
        run: |
          mkdir -p calibration
          git fetch --quiet --depth=1 origin "${{ github.event.repository.default_branch || 'main' }}"
          git show "FETCH_HEAD:records/calibration/${{ inputs.judge }}.json" > calibration/record.json || rm -f calibration/record.json
      - name: Band P1
        uses: ./.github/actions/band
        with:
          band: P1
          priority: "1"
          report: live_live_p1
          engine: ${{ inputs.engine }}
          mode: live
          judge_mode: live
          judge_engine: ${{ inputs.judge }}
          max_spend: ${{ steps.spend.outputs.remaining }}
          calibration_record: calibration/record.json
          preconditions_record: reports/preconditions.json
          blocking: "true"
      - name: Carry the outcomes to P2-P4
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: carry-live-live-after-p1-${{ inputs.engine }}
          path: reports/carry.json
          retention-days: 1
      - name: Publish what this band spent to the live bands after it
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: spend-${{ inputs.engine }}-live-live-p1
          path: reports/junit_mqc_live_live_p1.xml
          retention-days: 1
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: mqc-reports-cases-${{ inputs.engine }}-live-live-p1-by-${{ inputs.judge }}
          path: reports/
          retention-days: 90

  live-live-lower:
    name: live -> live on ${{ inputs.engine }}, P2-P4, pass floor, judged by ${{ inputs.judge }}
    needs: [resolve, preconditions, calibration, live-live-p1]
    if: ${{ !cancelled() && needs.preconditions.result == 'success' && needs.calibration.result == 'success' }}
    runs-on: ${{ inputs.os }}
    environment: live
    env:
      MQC_CODE_REF: ${{ needs.resolve.outputs.harness_sha }}
      MQC_CASE_REF: ${{ github.sha }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install the resolved harness and this repository
        shell: bash
        run: |
          python -m pip install --quiet \
            "ap-harness-qc[dev] @ git+https://github.com/${{ needs.resolve.outputs.harness_repository }}@${{ needs.resolve.outputs.harness_sha }}"
          python -m pip install --quiet --no-deps --editable "."
      - name: Take the record the preconditions job wrote
        uses: actions/download-artifact@v7
        with:
          name: preconditions-${{ inputs.engine }}
          path: reports/
      - name: Take the outcomes P0 and P1 established
        uses: actions/download-artifact@v7
        with:
          name: carry-live-live-after-p1-${{ inputs.engine }}
          path: reports/
      - name: Take the reports of the live bands before this one
        uses: actions/download-artifact@v7
        with:
          pattern: spend-${{ inputs.engine }}-*
          path: spent/
          merge-multiple: true
      - name: What the live bands before this one left of the ceiling
        id: spend
        shell: bash
        run: python -m tools.spend_remaining --ceiling "${{ inputs.max_spend }}" --reports spent --earlier 2 --output "$GITHUB_OUTPUT"
      - name: Take the judge's calibration record from the default branch
        shell: bash
        run: |
          mkdir -p calibration
          git fetch --quiet --depth=1 origin "${{ github.event.repository.default_branch || 'main' }}"
          git show "FETCH_HEAD:records/calibration/${{ inputs.judge }}.json" > calibration/record.json || rm -f calibration/record.json
      - name: Band P2-P4
        uses: ./.github/actions/band
        with:
          band: P2-P4
          priority: "2,3,4"
          report: live_live_p2_p4
          engine: ${{ inputs.engine }}
          mode: live
          judge_mode: live
          judge_engine: ${{ inputs.judge }}
          max_spend: ${{ steps.spend.outputs.remaining }}
          calibration_record: calibration/record.json
          preconditions_record: reports/preconditions.json
          blocking: "false"
      - name: Publish what this band spent
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: spend-${{ inputs.engine }}-live-live-lower
          path: reports/junit_mqc_live_live_p2_p4.xml
          retention-days: 1
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: mqc-reports-cases-${{ inputs.engine }}-live-live-p2_p4-by-${{ inputs.judge }}
          path: reports/
          retention-days: 90

  report:
    name: report
    needs: [resolve, preconditions, calibration, live-live-p0, live-live-p1, live-live-lower]
    if: always()
    runs-on: ubuntu-26.04
    steps:
      - name: Summarise the checks and the bands
        shell: bash
        run: |
          {
            echo "## The regression run on ${{ inputs.os }}"
            echo ""
            echo "| Job | Result |"
            echo "|---|---|"
            echo "| preconditions | ${{ needs.preconditions.result }} |"
            echo "| calibration check, judge ${{ inputs.judge }} | ${{ needs.calibration.result }} |"
            echo "| live -> live, P0 | ${{ needs.live-live-p0.result }} |"
            echo "| live -> live, P1 | ${{ needs.live-live-p1.result }} |"
            echo "| live -> live, P2-P4 | ${{ needs.live-live-lower.result }} |"
            echo ""
            echo "A red check means nothing was measured and nothing was spent. P0"
            echo "and P1 are release blocking and pass every case they selected;"
            echo "P2-P4 answers to the pass floor, and a skip counts as not passed"
            echo "in every band. Per A2 a model regression never blocks a merge."
          } >> "$GITHUB_STEP_SUMMARY"
