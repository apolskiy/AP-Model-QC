# SPDX-License-Identifier: MIT
# The attribution ladder for ONE engine, banded as the gate is.
#
# Specified by docs/design/consumer_ci.md sections 7, 7.8 and 4.18.
#
# A GRADED RUN HAS TWO MOVING PARTS, the candidate and the judge, and a single
# job that moves both can only report that something changed. Each rung holds
# everything fixed except one thing.
#
#   1  replay candidate, replay judge    ->  OUR CODE changed a frozen outcome
#   2  replay candidate, live judge      ->  THE JUDGE moved
#   3  live candidate,    live judge     ->  THE MODEL moved
#
# EACH RUNG IS THE GATE'S THREE BANDS, since 2026-11-12: P0 and P1 release
# blocking, P2-P4 against the pass floor, each a job calling the one band
# definition, each carrying its outcomes to the next so a dependent of a failed
# foundation skips before its candidate is dispatched. A red rung stops the
# next. Section 7.8.
#
# ONE ENGINE PER CALL, AND NOTHING AGGREGATES. These are the products of
# different companies evaluated against one harness: a combined result
# is an average over four vendors, which answers no question anybody asks.
# Section 4.18.
name: evaluate-engine

on:
  workflow_call:
    inputs:
      max_spend:
        description: >-
          USD ceiling for the whole ladder. Each live band spends what the live
          bands before it left (section 7.8.4)
        required: false
        default: "7.00"
        type: string
      engine:
        description: "Which engine the ladder evaluates"
        required: true
        type: string
      judge:
        description: >-
          Which engine grades rungs 2 and 3. Rung 1 has no judge dimension:
          it replays both halves, and the code reading a stored judgement does
          not vary with the engine that produced it (section 7.7.1).
        required: false
        default: "gemini"
        type: string
      os:
        description: >-
          The one platform every job running the suite takes. A live run
          measures the model and the judge, which no platform changes; the
          gate tests the harness on both (section 7.8.3)
        required: false
        default: "ubuntu-26.04"
        type: string

permissions:
  contents: read
  actions: read

env:
  PYTHON_VERSION: "3.14"

jobs:
  # RUNG 0, AND IT IS NOT A RUNG. It measures nothing; it decides whether the
  # ladder has an instrument worth spending on. ONE RESOLVE FOR ALL THREE
  # RUNGS, so the harness cannot move between rung 1 and rung 3. Section 7.6.
  resolve:
    name: resolve the paired harness
    runs-on: ubuntu-26.04
    outputs:
      harness_repository: ${{ steps.pin.outputs.harness_repository }}
      harness_sha: ${{ steps.pin.outputs.harness_sha }}
      green: ${{ steps.pin.outputs.green }}
      reason: ${{ steps.pin.outputs.reason }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # PYYAML, AND NOTHING ELSE, BECAUSE THE HARNESS MUST NOT BE HERE. The
      # resolver decides whether the paired harness is verified, and installing
      # that harness to make the decision would ask an unverified ref to vouch
      # for itself. The version matches the `pyyaml` pin in `pyproject.toml`.
      - name: Install PyYAML for the resolver
        run: python -m pip install --quiet "pyyaml>=6.0,<7.0"

      - name: Resolve the pairing and assess it
        id: pin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m tools.harness_pin --case-branch "${{ github.ref_name }}"

      - name: Say what the ladder is about to measure with
        if: always()
        shell: bash
        run: |
          {
            echo "## Harness pairing"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Harness commit | ${{ steps.pin.outputs.harness_sha }} |"
            echo "| Gate green | ${{ steps.pin.outputs.green }} |"
            echo ""
            echo "${{ steps.pin.outputs.reason }}"
          } >> "$GITHUB_STEP_SUMMARY"

  # GATE 2 AHEAD OF EVERY RUNG. A red here means nothing was measured and
  # nothing was spent. It writes the record every band reads, guarded by both
  # commits and the platform, so it runs on the chosen one. Sections 7.2.1
  # and 7.8.3; harness `cmn_verdict_and_cli.md` section 7.1.4.
  preconditions:
    name: preconditions, not a model finding (${{ inputs.engine }}, ${{ inputs.os }})
    needs: resolve
    if: needs.resolve.outputs.green == 'true'
    runs-on: ${{ inputs.os }}
    env:
      MQC_CODE_REF: ${{ needs.resolve.outputs.harness_sha }}
      MQC_CASE_REF: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install the resolved harness and this repository
        shell: bash
        run: |
          python -m pip install --quiet \
            "ap-harness-qc[dev] @ git+https://github.com/${{ needs.resolve.outputs.harness_repository }}@${{ needs.resolve.outputs.harness_sha }}"
          python -m pip install --quiet --no-deps --editable "."

      - name: Gate 2, the corpus preconditions
        run: pytest -m unit --preconditions-record reports/preconditions.json --junitxml=reports/junit_mqc_unit.xml --alluredir=reports/allure-results

      - name: Carry the precondition record to the bands
        uses: actions/upload-artifact@v6
        with:
          name: preconditions-${{ inputs.engine }}
          path: reports/preconditions.json
          if-no-files-found: error
          retention-days: 1

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: mqc-reports-cases-${{ inputs.engine }}-preconditions
          path: reports/
          retention-days: 90

  # RUNG 1: OUR CODE. Both sides replayed, so no environment and no key. It is
  # the precondition for spending: a red here stops rungs 2 and 3.
  deterministic-p0:
    name: 1 - our code (replay, replay) on ${{ inputs.engine }}, P0, release blocking
    needs: [resolve, preconditions]
    runs-on: ${{ inputs.os }}
    env:
      MQC_CODE_REF: ${{ needs.resolve.outputs.harness_sha }}
      MQC_CASE_REF: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install the resolved harness and this repository
        shell: bash
        run: |
          python -m pip install --quiet \
            "ap-harness-qc[dev] @ git+https://github.com/${{ needs.resolve.outputs.harness_repository }}@${{ needs.resolve.outputs.harness_sha }}"
          python -m pip install --quiet --no-deps --editable "."
      - name: Take the record the preconditions job wrote
        uses: actions/download-artifact@v7
        with:
          name: preconditions-${{ inputs.engine }}
          path: reports/
      - name: Band P0
        uses: ./.github/actions/band
        with:
          band: P0
          priority: "0"
          report: deterministic_p0
          engine: ${{ inputs.engine }}
          mode: replay
          preconditions_record: reports/preconditions.json
          blocking: "true"
      - name: Carry the outcomes to P1
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: carry-deterministic-after-p0-${{ inputs.engine }}
          path: reports/carry.json
          retention-days: 1
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: mqc-reports-cases-${{ inputs.engine }}-replay-replay-p0
          path: reports/
          retention-days: 90

  deterministic-p1:
    name: 1 - our code (replay, replay) on ${{ inputs.engine }}, P1, release blocking
    needs: [resolve, preconditions, deterministic-p0]
    if: ${{ !cancelled() && needs.preconditions.result == 'success' }}
    runs-on: ${{ inputs.os }}
    env:
      MQC_CODE_REF: ${{ needs.resolve.outputs.harness_sha }}
      MQC_CASE_REF: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install the resolved harness and this repository
        shell: bash
        run: |
          python -m pip install --quiet \
            "ap-harness-qc[dev] @ git+https://github.com/${{ needs.resolve.outputs.harness_repository }}@${{ needs.resolve.outputs.harness_sha }}"
          python -m pip install --quiet --no-deps --editable "."
      - name: Take the record the preconditions job wrote
        uses: actions/download-artifact@v7
        with:
          name: preconditions-${{ inputs.engine }}
          path: reports/
      - name: Take the outcomes P0 established
        uses: actions/download-artifact@v7
        with:
          name: carry-deterministic-after-p0-${{ inputs.engine }}
          path: reports/
      - name: Band P1
        uses: ./.github/actions/band
        with:
          band: P1
          priority: "1"
          report: deterministic_p1
          engine: ${{ inputs.engine }}
          mode: replay
          preconditions_record: reports/preconditions.json
          blocking: "true"
      - name: Carry the outcomes to P2-P4
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: carry-deterministic-after-p1-${{ inputs.engine }}
          path: reports/carry.json
          retention-days: 1
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: mqc-reports-cases-${{ inputs.engine }}-replay-replay-p1
          path: reports/
          retention-days: 90

  deterministic-lower:
    name: 1 - our code (replay, replay) on ${{ inputs.engine }}, P2-P4, pass floor
    needs: [resolve, preconditions, deterministic-p1]
    if: ${{ !cancelled() && needs.preconditions.result == 'success' }}
    runs-on: ${{ inputs.os }}
    env:
      MQC_CODE_REF: ${{ needs.resolve.outputs.harness_sha }}
      MQC_CASE_REF: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install the resolved harness and this repository
        shell: bash
        run: |
          python -m pip install --quiet \
            "ap-harness-qc[dev] @ git+https://github.com/${{ needs.resolve.outputs.harness_repository }}@${{ needs.resolve.outputs.harness_sha }}"
          python -m pip install --quiet --no-deps --editable "."
      - name: Take the record the preconditions job wrote
        uses: actions/download-artifact@v7
        with:
          name: preconditions-${{ inputs.engine }}
          path: reports/
      - name: Take the outcomes P0 and P1 established
        uses: actions/download-artifact@v7
        with:
          name: carry-deterministic-after-p1-${{ inputs.engine }}
          path: reports/
      - name: Band P2-P4
        uses: ./.github/actions/band
        with:
          band: P2-P4
          priority: "2,3,4"
          report: deterministic_p2_p4
          engine: ${{ inputs.engine }}
          mode: replay
          preconditions_record: reports/preconditions.json
          blocking: "false"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: mqc-reports-cases-${{ inputs.engine }}-replay-replay-p2_p4
          path: reports/
          retention-days: 90

  # RUNG 2: THE JUDGE IS THE ONLY THING THAT MOVED. Same stored responses,
  # scored by the judge as it answers today. It does not calibrate: each band
  # reads the judge's calibration record from the default branch, and a
  # family whose calibration did not hold, or a record that no longer
  # describes the judge, skips its judged cases before the judge is called
  # (section 7.4.5).
  #
  # EACH LIVE BAND SPENDS WHAT THE LIVE BANDS BEFORE IT LEFT of the one
  # ceiling, read from the spend each published (section 7.8.4).
  #
  # A RED RUNG 2 REFRESHES NOTHING. Stored judgements stay authoritative and
  # rung 1 keeps working; recalibrate before accepting a new judge (7.5).
  judge-p0:
    name: 2 - the judge (replay, live) on ${{ inputs.engine }}, P0, release blocking, judged by ${{ inputs.judge }}
    needs: [resolve, preconditions, deterministic-p0, deterministic-p1, deterministic-lower]
    runs-on: ${{ inputs.os }}
    environment: live
    env:
      MQC_CODE_REF: ${{ needs.resolve.outputs.harness_sha }}
      MQC_CASE_REF: ${{ github.sha }}
      # EVERY JUDGE'S KEY IS OFFERED AND THE NAMED ONE READS ITS OWN. A judge
      # whose key is absent refuses at preflight (section 4.17.2).
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install the resolved harness and this repository
        shell: bash
        run: |
          python -m pip install --quiet \
            "ap-harness-qc[dev] @ git+https://github.com/${{ needs.resolve.outputs.harness_repository }}@${{ needs.resolve.outputs.harness_sha }}"
          python -m pip install --quiet --no-deps --editable "."
      - name: Take the record the preconditions job wrote
        uses: actions/download-artifact@v7
        with:
          name: preconditions-${{ inputs.engine }}
          path: reports/
      - name: What the live bands before this one left of the ceiling
        id: spend
        shell: bash
        run: python -m tools.spend_remaining --ceiling "${{ inputs.max_spend }}" --reports spent --earlier 0 --output "$GITHUB_OUTPUT"
      - name: Take the judge's calibration record from the default branch
        shell: bash
        run: |
          mkdir -p calibration
          git fetch --quiet --depth=1 origin "${{ github.event.repository.default_branch || 'main' }}"
          git show "FETCH_HEAD:records/calibration/${{ inputs.judge }}.json" > calibration/record.json || rm -f calibration/record.json
      - name: Band P0
        uses: ./.github/actions/band
        with:
          band: P0
          priority: "0"
          report: judge_p0
          engine: ${{ inputs.engine }}
          mode: replay
          judge_mode: live
          judge_engine: ${{ inputs.judge }}
          max_spend: ${{ steps.spend.outputs.remaining }}
          calibration_record: calibration/record.json
          preconditions_record: reports/preconditions.json
          blocking: "true"
      - name: Carry the outcomes to P1
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: carry-judge-after-p0-${{ inputs.engine }}
          path: reports/carry.json
          retention-days: 1
      - name: Publish what this band spent to the live bands after it
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: spend-${{ inputs.engine }}-judge-p0
          path: reports/junit_mqc_judge_p0.xml
          retention-days: 1
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: mqc-reports-cases-${{ inputs.engine }}-replay-live-p0-by-${{ inputs.judge }}
          path: reports/
          retention-days: 90

  judge-p1:
    name: 2 - the judge (replay, live) on ${{ inputs.engine }}, P1, release blocking, judged by ${{ inputs.judge }}
    needs: [resolve, preconditions, judge-p0]
    if: ${{ !cancelled() && needs.preconditions.result == 'success' }}
    runs-on: ${{ inputs.os }}
    environment: live
    env:
      MQC_CODE_REF: ${{ needs.resolve.outputs.harness_sha }}
      MQC_CASE_REF: ${{ github.sha }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install the resolved harness and this repository
        shell: bash
        run: |
          python -m pip install --quiet \
            "ap-harness-qc[dev] @ git+https://github.com/${{ needs.resolve.outputs.harness_repository }}@${{ needs.resolve.outputs.harness_sha }}"
          python -m pip install --quiet --no-deps --editable "."
      - name: Take the record the preconditions job wrote
        uses: actions/download-artifact@v7
        with:
          name: preconditions-${{ inputs.engine }}
          path: reports/
      - name: Take the outcomes P0 established
        uses: actions/download-artifact@v7
        with:
          name: carry-judge-after-p0-${{ inputs.engine }}
          path: reports/
      - name: Take the reports of the live bands before this one
        uses: actions/download-artifact@v7
        with:
          pattern: spend-${{ inputs.engine }}-*
          path: spent/
          merge-multiple: true
      - name: What the live bands before this one left of the ceiling
        id: spend
        shell: bash
        run: python -m tools.spend_remaining --ceiling "${{ inputs.max_spend }}" --reports spent --earlier 1 --output "$GITHUB_OUTPUT"
      - name: Take the judge's calibration record from the default branch
        shell: bash
        run: |
          mkdir -p calibration
          git fetch --quiet --depth=1 origin "${{ github.event.repository.default_branch || 'main' }}"
          git show "FETCH_HEAD:records/calibration/${{ inputs.judge }}.json" > calibration/record.json || rm -f calibration/record.json
      - name: Band P1
        uses: ./.github/actions/band
        with:
          band: P1
          priority: "1"
          report: judge_p1
          engine: ${{ inputs.engine }}
          mode: replay
          judge_mode: live
          judge_engine: ${{ inputs.judge }}
          max_spend: ${{ steps.spend.outputs.remaining }}
          calibration_record: calibration/record.json
          preconditions_record: reports/preconditions.json
          blocking: "true"
      - name: Carry the outcomes to P2-P4
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: carry-judge-after-p1-${{ inputs.engine }}
          path: reports/carry.json
          retention-days: 1
      - name: Publish what this band spent to the live bands after it
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: spend-${{ inputs.engine }}-judge-p1
          path: reports/junit_mqc_judge_p1.xml
          retention-days: 1
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: mqc-reports-cases-${{ inputs.engine }}-replay-live-p1-by-${{ inputs.judge }}
          path: reports/
          retention-days: 90

  judge-lower:
    name: 2 - the judge (replay, live) on ${{ inputs.engine }}, P2-P4, pass floor, judged by ${{ inputs.judge }}
    needs: [resolve, preconditions, judge-p1]
    if: ${{ !cancelled() && needs.preconditions.result == 'success' }}
    runs-on: ${{ inputs.os }}
    environment: live
    env:
      MQC_CODE_REF: ${{ needs.resolve.outputs.harness_sha }}
      MQC_CASE_REF: ${{ github.sha }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install the resolved harness and this repository
        shell: bash
        run: |
          python -m pip install --quiet \
            "ap-harness-qc[dev] @ git+https://github.com/${{ needs.resolve.outputs.harness_repository }}@${{ needs.resolve.outputs.harness_sha }}"
          python -m pip install --quiet --no-deps --editable "."
      - name: Take the record the preconditions job wrote
        uses: actions/download-artifact@v7
        with:
          name: preconditions-${{ inputs.engine }}
          path: reports/
      - name: Take the outcomes P0 and P1 established
        uses: actions/download-artifact@v7
        with:
          name: carry-judge-after-p1-${{ inputs.engine }}
          path: reports/
      - name: Take the reports of the live bands before this one
        uses: actions/download-artifact@v7
        with:
          pattern: spend-${{ inputs.engine }}-*
          path: spent/
          merge-multiple: true
      - name: What the live bands before this one left of the ceiling
        id: spend
        shell: bash
        run: python -m tools.spend_remaining --ceiling "${{ inputs.max_spend }}" --reports spent --earlier 2 --output "$GITHUB_OUTPUT"
      - name: Take the judge's calibration record from the default branch
        shell: bash
        run: |
          mkdir -p calibration
          git fetch --quiet --depth=1 origin "${{ github.event.repository.default_branch || 'main' }}"
          git show "FETCH_HEAD:records/calibration/${{ inputs.judge }}.json" > calibration/record.json || rm -f calibration/record.json
      - name: Band P2-P4
        uses: ./.github/actions/band
        with:
          band: P2-P4
          priority: "2,3,4"
          report: judge_p2_p4
          engine: ${{ inputs.engine }}
          mode: replay
          judge_mode: live
          judge_engine: ${{ inputs.judge }}
          max_spend: ${{ steps.spend.outputs.remaining }}
          calibration_record: calibration/record.json
          preconditions_record: reports/preconditions.json
          blocking: "false"
      - name: Publish what this band spent to the live bands after it
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: spend-${{ inputs.engine }}-judge-lower
          path: reports/junit_mqc_judge_p2_p4.xml
          retention-days: 1
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: mqc-reports-cases-${{ inputs.engine }}-replay-live-p2_p4-by-${{ inputs.judge }}
          path: reports/
          retention-days: 90

  # RUNG 3: BOTH SIDES LIVE. THE ONLY RUNG THAT REPORTS A FINDING ABOUT THE
  # MODEL, and per A2 a model regression never blocks a merge. Each rung
  # carries its own outcomes: rung 1's replayed foundations say nothing about
  # a live response (section 7.8.2).
  model-p0:
    name: 3 - the model (live, live) on ${{ inputs.engine }}, P0, release blocking, judged by ${{ inputs.judge }}
    needs: [resolve, preconditions, judge-p0, judge-p1, judge-lower]
    runs-on: ${{ inputs.os }}
    environment: live
    env:
      MQC_CODE_REF: ${{ needs.resolve.outputs.harness_sha }}
      MQC_CASE_REF: ${{ github.sha }}
      # EVERY PROVIDER'S KEY IS OFFERED AND EACH ADAPTER READS ITS OWN, the
      # variable it declares through `credential_variables`. A leg whose key
      # is absent refuses at preflight (section 4.17.2); `MQC_CAS_UNI_115710`
      # requires a line here per rostered engine.
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install the resolved harness and this repository
        shell: bash
        run: |
          python -m pip install --quiet \
            "ap-harness-qc[dev] @ git+https://github.com/${{ needs.resolve.outputs.harness_repository }}@${{ needs.resolve.outputs.harness_sha }}"
          python -m pip install --quiet --no-deps --editable "."
      - name: Take the record the preconditions job wrote
        uses: actions/download-artifact@v7
        with:
          name: preconditions-${{ inputs.engine }}
          path: reports/
      - name: Take the reports of the live bands before this one
        uses: actions/download-artifact@v7
        with:
          pattern: spend-${{ inputs.engine }}-*
          path: spent/
          merge-multiple: true
      - name: What the live bands before this one left of the ceiling
        id: spend
        shell: bash
        run: python -m tools.spend_remaining --ceiling "${{ inputs.max_spend }}" --reports spent --earlier 3 --output "$GITHUB_OUTPUT"
      - name: Take the judge's calibration record from the default branch
        shell: bash
        run: |
          mkdir -p calibration
          git fetch --quiet --depth=1 origin "${{ github.event.repository.default_branch || 'main' }}"
          git show "FETCH_HEAD:records/calibration/${{ inputs.judge }}.json" > calibration/record.json || rm -f calibration/record.json
      - name: Band P0
        uses: ./.github/actions/band
        with:
          band: P0
          priority: "0"
          report: model_p0
          engine: ${{ inputs.engine }}
          mode: live
          judge_mode: live
          judge_engine: ${{ inputs.judge }}
          max_spend: ${{ steps.spend.outputs.remaining }}
          calibration_record: calibration/record.json
          preconditions_record: reports/preconditions.json
          blocking: "true"
      - name: Carry the outcomes to P1
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: carry-model-after-p0-${{ inputs.engine }}
          path: reports/carry.json
          retention-days: 1
      - name: Publish what this band spent to the live bands after it
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: spend-${{ inputs.engine }}-model-p0
          path: reports/junit_mqc_model_p0.xml
          retention-days: 1
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: mqc-reports-cases-${{ inputs.engine }}-live-live-p0-by-${{ inputs.judge }}
          path: reports/
          retention-days: 90

  model-p1:
    name: 3 - the model (live, live) on ${{ inputs.engine }}, P1, release blocking, judged by ${{ inputs.judge }}
    needs: [resolve, preconditions, model-p0]
    if: ${{ !cancelled() && needs.preconditions.result == 'success' }}
    runs-on: ${{ inputs.os }}
    environment: live
    env:
      MQC_CODE_REF: ${{ needs.resolve.outputs.harness_sha }}
      MQC_CASE_REF: ${{ github.sha }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install the resolved harness and this repository
        shell: bash
        run: |
          python -m pip install --quiet \
            "ap-harness-qc[dev] @ git+https://github.com/${{ needs.resolve.outputs.harness_repository }}@${{ needs.resolve.outputs.harness_sha }}"
          python -m pip install --quiet --no-deps --editable "."
      - name: Take the record the preconditions job wrote
        uses: actions/download-artifact@v7
        with:
          name: preconditions-${{ inputs.engine }}
          path: reports/
      - name: Take the outcomes P0 established
        uses: actions/download-artifact@v7
        with:
          name: carry-model-after-p0-${{ inputs.engine }}
          path: reports/
      - name: Take the reports of the live bands before this one
        uses: actions/download-artifact@v7
        with:
          pattern: spend-${{ inputs.engine }}-*
          path: spent/
          merge-multiple: true
      - name: What the live bands before this one left of the ceiling
        id: spend
        shell: bash
        run: python -m tools.spend_remaining --ceiling "${{ inputs.max_spend }}" --reports spent --earlier 4 --output "$GITHUB_OUTPUT"
      - name: Take the judge's calibration record from the default branch
        shell: bash
        run: |
          mkdir -p calibration
          git fetch --quiet --depth=1 origin "${{ github.event.repository.default_branch || 'main' }}"
          git show "FETCH_HEAD:records/calibration/${{ inputs.judge }}.json" > calibration/record.json || rm -f calibration/record.json
      - name: Band P1
        uses: ./.github/actions/band
        with:
          band: P1
          priority: "1"
          report: model_p1
          engine: ${{ inputs.engine }}
          mode: live
          judge_mode: live
          judge_engine: ${{ inputs.judge }}
          max_spend: ${{ steps.spend.outputs.remaining }}
          calibration_record: calibration/record.json
          preconditions_record: reports/preconditions.json
          blocking: "true"
      - name: Carry the outcomes to P2-P4
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: carry-model-after-p1-${{ inputs.engine }}
          path: reports/carry.json
          retention-days: 1
      - name: Publish what this band spent to the live bands after it
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: spend-${{ inputs.engine }}-model-p1
          path: reports/junit_mqc_model_p1.xml
          retention-days: 1
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: mqc-reports-cases-${{ inputs.engine }}-live-live-p1-by-${{ inputs.judge }}
          path: reports/
          retention-days: 90

  model-lower:
    name: 3 - the model (live, live) on ${{ inputs.engine }}, P2-P4, pass floor, judged by ${{ inputs.judge }}
    needs: [resolve, preconditions, model-p1]
    if: ${{ !cancelled() && needs.preconditions.result == 'success' }}
    runs-on: ${{ inputs.os }}
    environment: live
    env:
      MQC_CODE_REF: ${{ needs.resolve.outputs.harness_sha }}
      MQC_CASE_REF: ${{ github.sha }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install the resolved harness and this repository
        shell: bash
        run: |
          python -m pip install --quiet \
            "ap-harness-qc[dev] @ git+https://github.com/${{ needs.resolve.outputs.harness_repository }}@${{ needs.resolve.outputs.harness_sha }}"
          python -m pip install --quiet --no-deps --editable "."
      - name: Take the record the preconditions job wrote
        uses: actions/download-artifact@v7
        with:
          name: preconditions-${{ inputs.engine }}
          path: reports/
      - name: Take the outcomes P0 and P1 established
        uses: actions/download-artifact@v7
        with:
          name: carry-model-after-p1-${{ inputs.engine }}
          path: reports/
      - name: Take the reports of the live bands before this one
        uses: actions/download-artifact@v7
        with:
          pattern: spend-${{ inputs.engine }}-*
          path: spent/
          merge-multiple: true
      - name: What the live bands before this one left of the ceiling
        id: spend
        shell: bash
        run: python -m tools.spend_remaining --ceiling "${{ inputs.max_spend }}" --reports spent --earlier 5 --output "$GITHUB_OUTPUT"
      - name: Take the judge's calibration record from the default branch
        shell: bash
        run: |
          mkdir -p calibration
          git fetch --quiet --depth=1 origin "${{ github.event.repository.default_branch || 'main' }}"
          git show "FETCH_HEAD:records/calibration/${{ inputs.judge }}.json" > calibration/record.json || rm -f calibration/record.json
      - name: Band P2-P4
        uses: ./.github/actions/band
        with:
          band: P2-P4
          priority: "2,3,4"
          report: model_p2_p4
          engine: ${{ inputs.engine }}
          mode: live
          judge_mode: live
          judge_engine: ${{ inputs.judge }}
          max_spend: ${{ steps.spend.outputs.remaining }}
          calibration_record: calibration/record.json
          preconditions_record: reports/preconditions.json
          blocking: "false"
      - name: Publish what this band spent
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: spend-${{ inputs.engine }}-model-lower
          path: reports/junit_mqc_model_p2_p4.xml
          retention-days: 1
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: mqc-reports-cases-${{ inputs.engine }}-live-live-p2_p4-by-${{ inputs.judge }}
          path: reports/
          retention-days: 90

  report:
    name: report
    needs: [resolve, preconditions, deterministic-p0, deterministic-p1, deterministic-lower,
            judge-p0, judge-p1, judge-lower, model-p0, model-p1, model-lower]
    if: always()
    runs-on: ubuntu-26.04
    steps:
      - name: Summarise which rung stopped, band by band
        shell: bash
        run: |
          {
            echo "## The attribution ladder on ${{ inputs.os }}"
            echo ""
            echo "| Rung | Holds fixed | P0 | P1 | P2-P4 |"
            echo "|---|---|---|---|---|"
            echo "| 1 our code | both replayed | ${{ needs.deterministic-p0.result }} | ${{ needs.deterministic-p1.result }} | ${{ needs.deterministic-lower.result }} |"
            echo "| 2 the judge | candidate replayed | ${{ needs.judge-p0.result }} | ${{ needs.judge-p1.result }} | ${{ needs.judge-lower.result }} |"
            echo "| 3 the model | nothing | ${{ needs.model-p0.result }} | ${{ needs.model-p1.result }} | ${{ needs.model-lower.result }} |"
            echo ""
            echo "**The first red rung is the attribution.** A rung that did not"
            echo "run was skipped because a band below it failed, which is the"
            echo "point: spending quota after a known break rediscovers it."
            echo ""
            echo "P0 and P1 are release blocking and P2-P4 answers to the pass"
            echo "floor. Only rung 3 reports a finding about the model, and per A2"
            echo "a model regression never blocks a merge."
          } >> "$GITHUB_STEP_SUMMARY"
