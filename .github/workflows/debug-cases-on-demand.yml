# SPDX-License-Identifier: MIT
# Running one case, or a few, without touching CI.
#
# Specified by docs/design/consumer_ci.md section 6.
#
# SEPARATE WORKFLOW, SEPARATE JOBS. Nothing this run does can contribute to,
# cancel or colour a gate run on the same commit. That is why it is a workflow
# rather than an input to gate-on-change.yml.
#
# THIS RUN YIELDS NO VERDICT AND REFUSES TO PRETEND OTHERWISE. A hand-typed set
# of test identifiers is a manual selection, so the three independent exclusions
# apply: an artifact name the collector does not match, marking that carries
# run_context ci_debug with gated false, and no status check reported.
#
# IT JUDGES A FAILED CASE, AND THE GATE NEVER DOES. A failed assertion says the
# case did not pass; it does not say whether the case is wrong or the model is
# wrong, and those prompt entirely different fixes. The rubric is what separates
# them, which is the whole reason to spend a judge request here.
#
# TWO JOBS, ONE PER MODE (consumer_ci.md section 6.5). debug_replay replays the
# candidate and the judge, names no environment and reaches no key, so it
# spends nothing and needs nobody's approval. debug_live runs live in the
# debug_live environment, which carries the owner as required reviewer, so it
# waits for approval, runs AT MOST 20 TESTS, defaults to a $0.50 ceiling, and
# keeps every recording it wrote in its artifact.
name: debug-cases-on-demand

on:
  workflow_dispatch:
    inputs:
      tests:
        description: "Test identifiers or full test names, one per line. Not nodeids. Live: at most 20"
        required: true
        type: string
      case_ref:
        description: "Branch of THIS repository. Defaults to the dispatching ref"
        required: false
        default: ""
        type: string
      harness_ref:
        description: "Harness ref to pin. Empty resolves it from config/harness_pin.yaml"
        required: false
        default: ""
        type: string
      max_spend:
        description: "USD ceiling for a live run, which is one or two cases. Replay spends nothing"
        required: false
        default: "0.50"
        type: string
      engine:
        description: "Engine to run against"
        required: false
        default: gemini
        type: choice
        options: [gemini, openai, claude, grok]
      mode:
        description: "replay spends nothing. live waits for approval and runs at most 20 tests"
        required: false
        default: replay
        type: choice
        options: [replay, live]
      judge:
        description: "judged, or unjudged to run the screen and assertions alone"
        required: false
        default: judged
        type: choice
        options: [judged, unjudged]

run-name: "DEBUG (no verdict) ${{ inputs.mode }} ${{ inputs.tests }} on ${{ inputs.case_ref || github.ref_name }}"

permissions:
  contents: read
  actions: read

env:
  PYTHON_VERSION: "3.14"

jobs:
  debug_replay:
    name: debug, replay
    if: inputs.mode == 'replay'
    runs-on: ubuntu-26.04
    # NO ENVIRONMENT AND NO KEY. Both sides replay, so nothing here can spend,
    # and a branch is debugged without anybody's approval.
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.case_ref || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # PYYAML, AND NOTHING ELSE, BECAUSE THE HARNESS MUST NOT BE HERE. The
      # resolver decides whether the paired harness is verified, and installing
      # that harness to make the decision would ask an unverified ref to vouch
      # for itself. `tools/harness_pin.py` therefore imports no harness module
      # and reads only the pin file, which needs a YAML parser.
      #
      # The version matches the `pyyaml` pin in `pyproject.toml`; it is repeated
      # here because a workflow cannot read that file before Python is installed.
      - name: Install PyYAML for the resolver
        run: python -m pip install --quiet "pyyaml>=6.0,<7.0"

      # BOTH REFS ARE INPUTS, because the pairing is what is under suspicion.
      # The mapping answers "which harness does this branch use", and the common
      # debugging question is whether a case fails against one harness and
      # passes against another, which a mapping cannot be used to ask.
      #
      # THE GREEN GATE DOES NOT APPLY. Refusing to debug against a harness that
      # is not green would withhold the tool exactly when it is needed. The run
      # records what it used and yields no verdict, and those two facts together
      # are what make that safe.
      - name: Resolve the harness to pin
        id: pin
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # THROUGH THE ENVIRONMENT, for the reason gate-on-change.yml gives at
          # its resolver step. A dispatch input is free text from whoever started
          # the run, and a ref is exactly the kind of value somebody pastes.
          HARNESS_REF: ${{ inputs.harness_ref }}
          CASE_REF: ${{ inputs.case_ref || github.ref_name }}
        run: |
          # ONE REDIRECT, NOT THREE. shellcheck SC2129: a group writes once
          # rather than reopening the file per line.
          if [ -n "${HARNESS_REF}" ]; then
            {
              echo "harness_repository=apolskiy/AP-Harness-QC"
              echo "harness_sha=${HARNESS_REF}"
              echo "source=input"
            } >> "$GITHUB_OUTPUT"
          else
            python -m tools.harness_pin --case-branch "${CASE_REF}" || true
            echo "source=mapping" >> "$GITHUB_OUTPUT"
          fi

      # THE TEST TOOLING ARRIVES WITH THE HARNESS `[dev]` EXTRA: pytest,
      # allure-pytest, pylint and pytest-randomly, all pinned there once. Its
      # absence was why every gate here reported a missing test runner, exit 127.
      #
      # `--no-deps` on this repository is deliberate and is why the extra is
      # needed. It stops this repository's own harness pin replacing the
      # candidate resolved above, and it discards extras too, so asking for
      # `.[dev]` asked pip for tooling it was told not to fetch.
      #
      # THIS NOTE SITS ABOVE THE STEP RATHER THAN INSIDE THE `run:` BODY. A
      # comment inside a run body is part of the shell script, and
      # `MQC_CAS_UNI_115702` reads run bodies looking for a graded invocation: an
      # earlier version of this note said "toolchain" beside the word for the
      # test runner, and `tool` matched inside it.
      - name: Install the harness and this repository
        shell: bash
        run: |
          python -m pip install --quiet \
            "ap-harness-qc[dev] @ git+https://github.com/${{ steps.pin.outputs.harness_repository }}@${{ steps.pin.outputs.harness_sha }}"
          python -m pip install --quiet --no-deps --editable "."

      # ONE ENTRY PER LINE, written to a file the harness reads. This step
      # used to validate the identifiers against `pytest --collect-only` with a
      # substring match and build a `-k` expression from them, which had three
      # faults the harness now fixes: a substring match selects a case nobody
      # asked for, because `134205` is a substring of `130015`; `-k` is applied
      # before `pytest_collection_modifyitems`, so it strips the foundations a
      # selected case rests on and no closure computed later can bring them
      # back; and a mistyped entry voided the whole run.
      #
      # `--tests-file` reports a mistyped entry as a skipped row carrying
      # QC_HARNESS_SELECTION_UNRESOLVED and runs the rest. Harness design
      # cmn_verdict_and_cli.md sections 7.8.1 and 7.8.3.
      - name: Write the requested tests, one per line
        id: resolve
        shell: bash
        env:
          REQUESTED: ${{ inputs.tests }}
        run: |
          python "${GITHUB_WORKSPACE}/tools/write_test_list.py" \
            --out reports/requested-tests.txt >> "$GITHUB_OUTPUT"

      - name: Run the selected cases, judging failures
        id: run
        continue-on-error: true
        env:
          # THROUGH THE ENVIRONMENT. The engine is a choice from a list this
          # workflow does not enforce in the shell, and the list is a path
          # rather than free text somebody types.
          SELECTION: reports/requested-tests.txt
          ENGINE: ${{ inputs.engine }}
        run: |
          pytest --tests-file "${SELECTION}" \
            --engine "${ENGINE}" \
            --mode replay \
            ${{ inputs.judge == 'unjudged' && '--judge-mode off' || '' }} \
            --judge-on-failure \
            --out-dir debug-artifacts/ \
            --junitxml=debug-artifacts/junit-debug.xml

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          # Does not begin with the collector prefix, so exclusion from the
          # durable record does not depend on a negative match.
          name: scratch-debug-cases-${{ github.run_id }}
          path: debug-artifacts/
          retention-days: 14

      - name: Write the debug summary
        if: always()
        shell: bash
        env:
          # THE SAME RULE. A summary line is a shell command like any other.
          CASE_REF_SHOWN: ${{ inputs.case_ref || github.ref_name }}
          HARNESS_SHA: ${{ steps.pin.outputs.harness_sha }}
          PIN_SOURCE: ${{ steps.pin.outputs.source }}
          TESTS_REQUESTED: ${{ steps.resolve.outputs.count }}
          ENGINE: ${{ inputs.engine }}
        run: |
          {
            echo "# Case debug run, replay"
            echo ""
            echo "**This run carries no verdict and gates nothing.**"
            echo "A hand-typed selection yields no verdict, whatever its result."
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Case ref | ${CASE_REF_SHOWN} |"
            echo "| Harness | ${HARNESS_SHA} (${PIN_SOURCE}) |"
            echo "| Tests requested | ${TESTS_REQUESTED} |"
            echo "| Engine, mode | ${ENGINE}, replay |"
            echo "| Judged on failure | yes |"
            echo ""
            echo "### Reading the rubric on a failed case"
            echo ""
            echo "A failed assertion says the case did not pass. The rubric says"
            echo "whether the case is wrong or the model is wrong:"
            echo ""
            echo "| Rubric shows | Likely fix |"
            echo "|---|---|"
            echo "| Good content, failed a shape assertion | The assertion or the case |"
            echo "| Content that was poor as well | The model |"
            echo ""
            echo "**A replay run spends nothing.** The candidate and the judge"
            echo "both come from recordings; a failed case no live run has judged"
            echo "reports its judgement as unavailable. consumer_ci.md section 6.4."
          } >> "$GITHUB_STEP_SUMMARY"

  debug_live:
    name: debug, live, at most 20 tests, after approval
    if: inputs.mode == 'live'
    runs-on: ubuntu-26.04
    # WAITS FOR APPROVAL. debug_live carries the owner as required reviewer and
    # admits any branch, because a debug run checks out case_ref; `live`, which
    # the regression run names, admits main alone and asks nobody.
    # consumer_ci.md section 6.5.
    environment: debug_live
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.case_ref || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # AT MOST 20 TESTS, REFUSED BEFORE ANYTHING IS INSTALLED OR SPENT. A
      # debug run is one or two cases, and past 20 it is a regression run
      # without its gates; split a larger selection across runs.
      - name: Write the requested tests, at most 20
        id: resolve
        shell: bash
        env:
          REQUESTED: ${{ inputs.tests }}
        run: |
          python "${GITHUB_WORKSPACE}/tools/write_test_list.py" \
            --out reports/requested-tests.txt --max-entries 20 >> "$GITHUB_OUTPUT"

      # The resolver and the install, as debug_replay states them: PyYAML
      # alone first, and THE GREEN GATE DOES NOT APPLY.
      - name: Install PyYAML for the resolver
        run: python -m pip install --quiet "pyyaml>=6.0,<7.0"

      - name: Resolve the harness to pin
        id: pin
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HARNESS_REF: ${{ inputs.harness_ref }}
          CASE_REF: ${{ inputs.case_ref || github.ref_name }}
        run: |
          if [ -n "${HARNESS_REF}" ]; then
            {
              echo "harness_repository=apolskiy/AP-Harness-QC"
              echo "harness_sha=${HARNESS_REF}"
              echo "source=input"
            } >> "$GITHUB_OUTPUT"
          else
            python -m tools.harness_pin --case-branch "${CASE_REF}" || true
            echo "source=mapping" >> "$GITHUB_OUTPUT"
          fi

      - name: Install the harness and this repository
        shell: bash
        run: |
          python -m pip install --quiet \
            "ap-harness-qc[dev] @ git+https://github.com/${{ steps.pin.outputs.harness_repository }}@${{ steps.pin.outputs.harness_sha }}"
          python -m pip install --quiet --no-deps --editable "."

      - name: Run the selected cases live, judging failures
        id: run
        continue-on-error: true
        env:
          # EVERY ROSTERED ENGINE'S KEY, because the engine is a choice. A
          # secret reaches a step only by name. Harness
          # `harness_ci_pipeline.md` section 8.5.4.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          SELECTION: reports/requested-tests.txt
          ENGINE: ${{ inputs.engine }}
          MAX_SPEND: ${{ inputs.max_spend }}
        run: |
          pytest --tests-file "${SELECTION}" \
            --max-spend "${MAX_SPEND}" \
            --engine "${ENGINE}" \
            --mode live \
            ${{ inputs.judge == 'unjudged' && '--judge-mode off' || '' }} \
            --judge-on-failure \
            --out-dir debug-artifacts/ \
            --junitxml=debug-artifacts/junit-debug.xml

      # KEEP WHAT THIS RUN RECORDED. A live run writes its recordings and
      # judgements into the checkout, which ends with the run, so every file
      # it added or changed is copied into the artifact, path kept, to be
      # downloaded and committed as a base recording. Whatever the outcome:
      # an unexpected answer or an error is what this run is for.
      - name: Keep the recordings this run wrote
        if: always()
        shell: bash
        run: |
          mkdir -p debug-artifacts/recordings
          git ls-files --modified --others --exclude-standard -- tests/fixtures/replay \
            | while IFS= read -r recorded; do
                cp --parents "${recorded}" debug-artifacts/recordings/
              done
          echo "kept $(find debug-artifacts/recordings -type f | wc -l) recorded file(s)"

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          # Does not begin with the collector prefix, so exclusion from the
          # durable record does not depend on a negative match.
          name: scratch-debug-cases-${{ github.run_id }}
          path: debug-artifacts/
          retention-days: 14

      - name: Write the debug summary
        if: always()
        shell: bash
        env:
          CASE_REF_SHOWN: ${{ inputs.case_ref || github.ref_name }}
          HARNESS_SHA: ${{ steps.pin.outputs.harness_sha }}
          PIN_SOURCE: ${{ steps.pin.outputs.source }}
          TESTS_REQUESTED: ${{ steps.resolve.outputs.count }}
          ENGINE: ${{ inputs.engine }}
          MAX_SPEND: ${{ inputs.max_spend }}
        run: |
          {
            echo "# Case debug run, live"
            echo ""
            echo "**This run carries no verdict and gates nothing.**"
            echo "A hand-typed selection yields no verdict, whatever its result."
            echo ""
            echo "**A live debug run takes at most 20 tests**, and a larger"
            echo "selection is refused before anything is spent: split it across runs."
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Case ref | ${CASE_REF_SHOWN} |"
            echo "| Harness | ${HARNESS_SHA} (${PIN_SOURCE}) |"
            echo "| Tests requested | ${TESTS_REQUESTED} of at most 20 |"
            echo "| Engine, mode | ${ENGINE}, live |"
            echo "| Ceiling | \$${MAX_SPEND} |"
            echo "| Judged on failure | yes |"
            echo ""
            echo "**The recordings this run wrote** are in the artifact under"
            echo "recordings/, each at its path in this repository. Commit one to"
            echo "make it the case's base recording. consumer_ci.md section 6.5."
          } >> "$GITHUB_STEP_SUMMARY"
