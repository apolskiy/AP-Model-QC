#
# ONE BAND DEFINITION, TAKING THE BAND AS A PARAMETER. Three hand-written
# copies of this procedure drifted three separate ways: the floor step took
# GitHub's default condition so the band that failed printed no counts, P2-P4
# ran its floor before its summary against the reason the others state, and the
# deselected count was dropped in one repository and not the other. None of
# those was a decision. Each was a copy.
#
# WHICH IS WHAT MAKES A BAND SPLIT A CALLER CHANGE. P2-P4 becomes P2, P3 and P4
# as the corpus grows, splitting when one band selects more than a thousand
# cases. With the band as an input that is three callers and no change here.
#
# Specified by `docs/design/consumer_ci.md` section 3.12.7.
name: Band
description: Run one priority band, report its counts, and assess its floor

inputs:
  band:
    description: "The band's name as a reader sees it, such as P0 or P2-P4"
    required: true
  priority:
    description: "The --priority expression, such as 0 or 2,3,4"
    required: true
  report:
    description: "The JUnit report's stem, such as p0 or p2_p4"
    required: true
  engine:
    description: "The candidate engine this band measures"
    required: true
  blocking:
    description: >-
      "true" where the band is release blocking, so its floor answers for every
      case it selected. Anything else is assessed against the pass floor.
    required: false
    default: "false"
  preconditions_record:
    description: >-
      The precondition record the preconditions job wrote, which is what makes
      this band's rows gated. Empty where there is none, and the band then
      yields no verdict rather than refusing. Harness
      `cmn_verdict_and_cli.md` section 7.1.4.
    required: false
    default: ""
  # WHAT A REGRESSION RUN'S STAGE VARIES, each defaulting to what the gate
  # passes, so the gate's band jobs are unchanged. `consumer_ci.md` section 7.8.1.
  mode:
    description: "The candidate's mode, the first half of the stage's pair: replay in the gate, replay -> replay and replay -> live; live in live -> live"
    required: false
    default: "replay"
  judge_mode:
    description: "The judge's mode, the second half of the pair, empty to follow the candidate's; live in replay -> live and live -> live"
    required: false
    default: ""
  judge_engine:
    description: "The engine grading the band, empty for the roster's; replay -> live and live -> live name it"
    required: false
    default: ""
  max_spend:
    description: "The band's ceiling in USD, 0 for none; a live band passes its remainder"
    required: false
    default: "0"
  calibration_record:
    description: >-
      The judge's calibration record a judged band reads, empty where the band
      judges nothing live. Section 7.4.5.
    required: false
    default: ""

runs:
  using: composite
  steps:
    # THE PYTEST STEP IS INVOKED BY ACTIONS RATHER THAN WRAPPED, so its own
    # header and the per-test PASSED, FAILED and SKIPPED listing appear in the
    # log exactly as they do from a job. A Python wrapper would nest that
    # output under a step named for the wrapper.
    #
    # THE RUN REPORTS AND THE FLOOR DECIDES, so this step records the status it
    # exited with and exits 0. A COMPOSITE STEP CANNOT CARRY
    # `continue-on-error`, so a pytest exit of 1 failed the job before the
    # floor was consulted, and all four engine gates went red on 2026-11-02 on
    # a lower band whose own verdict line read "the band cleared its floor".
    # The floor step below takes the status and owns the outcome, in every
    # band. Design `consumer_ci.md` section 3.12.2.
    #
    # THE MODES, JUDGE, CEILING AND RECORD ARE WRITTEN INTO THE COMMAND, not
    # assembled by the shell, so a reader of a job sees the invocation that
    # job makes (`tests/cases/workflow_support.py` resolves them). Each empty
    # value is the harness's own default.
    - name: Band ${{ inputs.band }}, candidate ${{ inputs.mode }}
      shell: bash
      env:
        # THE RECORD THE PRECONDITIONS JOB WROTE, read from the environment so
        # an empty input omits the flag rather than naming an empty path.
        PRECONDITIONS_RECORD: ${{ inputs.preconditions_record }}
      run: |
        set +e
        pytest -m "evaluator or tool or sec" \
          --engine ${{ inputs.engine }} \
          --mode ${{ inputs.mode }} \
          --judge-mode "${{ inputs.judge_mode }}" \
          --judge-engine "${{ inputs.judge_engine }}" \
          --max-spend "${{ inputs.max_spend }}" \
          --calibration-record "${{ inputs.calibration_record }}" \
          --priority ${{ inputs.priority }} \
          ${PRECONDITIONS_RECORD:+--preconditions-record "${PRECONDITIONS_RECORD}"} \
          --carry-outcomes reports/carry.json \
          --junitxml=reports/junit_mqc_${{ inputs.report }}.xml \
          --alluredir=reports/allure-results
        BAND_RUN_STATUS=$?
        set -e
        echo "BAND_RUN_STATUS=${BAND_RUN_STATUS}" >> "$GITHUB_ENV"
        echo "the band's run exited ${BAND_RUN_STATUS}, and its floor decides"

    # THE BAND'S OWN DENOMINATOR. pytest's last line reports what it declined
    # to run, and the deselected count is every precondition plus the other
    # bands: no rate divides into it. Harness `cmn_verdict_and_cli.md` 7.11.
    #
    # READ FROM THE REPORT, NOT PIPED FROM THE RUN. Piping would make the
    # band step's exit status that of the last command in the pipeline.
    #
    # BEFORE THE FLOOR, so the figures reach the job summary whichever way the
    # floor goes: a step that fails before publishing them hides them.
    - name: Band ${{ inputs.band }} result, in the band's own terms
      if: always()
      shell: bash
      run: |
        {
          echo "### Band ${{ inputs.band }} on ${{ inputs.engine }}, ${{ runner.os }}"
          echo ""
          python -m tools.band_report \
            reports/junit_mqc_${{ inputs.report }}.xml \
            --priority ${{ inputs.priority }}
          echo ""
        } >> "$GITHUB_STEP_SUMMARY"

    # EVERY CASE THE BAND SELECTED, not every case it managed to run. pytest
    # exits zero on a run that skipped half of what it collected, so a band
    # reported success at seven of eleven with four blocking cases unmeasured.
    # `consumer_ci.md` section 3.12.2.
    #
    # ALWAYS, BECAUSE THE BAND THAT FAILED IS THE ONE THESE COUNTS ARE FOR.
    #
    # AND THE RUN'S STATUS, which this step weighs rather than the job taking
    # it. An unset variable reads as -1 and refuses, because a band whose run
    # reported nothing cannot be said to have measured anything.
    - name: Band ${{ inputs.band }} answered for everything it selected
      if: always() && inputs.blocking == 'true'
      shell: bash
      run: |
        python tools/band_floor.py \
          reports/junit_mqc_${{ inputs.report }}.xml \
          --run-status="${BAND_RUN_STATUS:--1}" \
          --blocking --engine ${{ inputs.engine }}

    # A LOWER BAND IS SCORED RATHER THAN HELD TO EVERY CASE, because a failure
    # there is a bug to open rather than a release blocker, so it is the only
    # band needing a pass rate. `consumer_ci.md` section 3.12.2.
    - name: Band ${{ inputs.band }} against its pass floor
      if: always() && inputs.blocking != 'true'
      shell: bash
      run: |
        python tools/band_floor.py \
          reports/junit_mqc_${{ inputs.report }}.xml \
          --run-status="${BAND_RUN_STATUS:--1}"
