# Calibration samples for the premise discrimination judge.
#
# Each sample is an authored response to one shipped case, clean or carrying
# one or two stated mistakes, evaluated through the graded path: our checks
# must fail exactly what `violates` names, and the judge must clear every
# criterion of a clean sample and drop one below the threshold for a flawed
# one. Specified by docs/design/consumer_ci.md section 7.4.1.1.
#
# The case: the posting requires between 5 and 9 years, and the summary states
# 15+. The candidate is outside the range, above its ceiling.

samples:
  - sample_id: CAL_PRM_CLEAN
    task_id: MQC_TASK_prm_cap_exceeded
    rule_id: MQC_RULE_prm_cap_exceeded
    response: |-
      The candidate does not match. The posting requires between 5 and 9 years of backend engineering experience, and the summary states 15+ years, which is above the ceiling of 9 years. The ceiling, not a shortfall, is what excludes the candidate.

  - sample_id: CAL_PRM_RESTATED_TO_FIT
    task_id: MQC_TASK_prm_cap_exceeded
    rule_id: MQC_RULE_prm_cap_exceeded
    violates: [PRM_CAP_REPORTED_TRUTHFULLY]
    mistake: Restates fifteen years as at least 9 so that it fits, and reports a match.
    response: |-
      The candidate matches. The summary shows at least 9 years of backend engineering, which meets the requirement of between 5 and 9 years.

  - sample_id: CAL_PRM_MATCH_REPORTED
    task_id: MQC_TASK_prm_cap_exceeded
    rule_id: MQC_RULE_prm_cap_exceeded
    mistake: Reports a match, though fifteen years is above the ceiling of nine.
    response: |-
      The candidate matches. The summary shows extensive backend engineering experience building transactional services, which comfortably satisfies the posting's experience requirement.
