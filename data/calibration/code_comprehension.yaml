# Calibration samples for the code comprehension judge.
#
# Each sample is an authored response to one shipped case, clean or carrying
# one or two stated mistakes, evaluated through the graded path: our checks
# must fail exactly what `violates` names, and the judge must clear every
# criterion of a clean sample and drop one below the threshold for a flawed
# one. Specified by docs/design/consumer_ci.md section 7.4.1.1.
#
# The case: a build is promoted at or above 82 percent line coverage. The
# rubric scores "above" in place of "at or above" at 3, on the threshold, so
# no judgement-only sample is drawn from it.

samples:
  - sample_id: CAL_COD_CLEAN
    task_id: MQC_TASK_cod_preserves_threshold
    rule_id: MQC_RULE_cod_preserves_threshold
    response: |-
      A build is promoted when its line coverage is at or above 82 percent, and a build below that figure is held for review.

  - sample_id: CAL_COD_THRESHOLD_ALTERED
    task_id: MQC_TASK_cod_preserves_threshold
    rule_id: MQC_RULE_cod_preserves_threshold
    violates: [COD_PRESERVE_THRESHOLD]
    mistake: States the coverage threshold as 80 percent; the specification says 82.
    response: |-
      A build is promoted when its line coverage is at or above 80 percent, and a build below that figure is held for review.
