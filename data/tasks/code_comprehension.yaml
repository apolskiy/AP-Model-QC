# What the model is sent for the code comprehension family.
#
# GENERATED BY tools/generate_code_corpus.py. Do not edit this file by hand:
# MQC_CAS_UNI_10433 compares it to what the generator builds, and an edit here
# would be reported and then lost at the next regeneration.
#
# Specified by model_evaluation_test_plan.md sections 9.9 and 8.11.
#
# THE EXCERPTS ARE INLINED COPIES OF GUARDED FIXTURES. ContextDocument carries
# inline content and has no file reference, so these are a second copy of text
# that tests/fixtures/excerpts/ holds and 10401 to 10403 guard by parsing and
# executing it. Generating them from the fixtures makes the copies identical;
# MQC_CAS_UNI_10428 keeps them identical.
#
# MOST OF THIS FAMILY BRINGS NO REQUIREMENTS OF ITS OWN. Cases 30029 to 30037
# formulate GND_001, GND_002 and GND_004 in the code domain: a grounding
# requirement is domain-independent, and the point of a second formulation is
# that the behaviour survives a change of domain.
#
# CASES 30038 TO 30040 ARE THE EXCEPTION, added 2026-09-26 under MDL_DEF. They
# are not grounding: stating a source correctly and diagnosing why the source is
# wrong are different questions, and the settlement excerpt showed it. Its three
# asserted outcomes all follow from ONE cause, so a model listing them scored as
# though it had found the cause.

# MQC_REQ_MDL_GND_0001, case 30029. No API absent from the snippet.
- task_id: MQC_TASK_cod_no_invented_api
  rubric_ids: [MQC_RULE_cod_no_invented_api]
  user_prompt: |
    Describe what the function below does, naming only the calls and
    attributes that appear in it.
  constraints:
    - constraint_id: COD_NO_INVENTED_API
      text: Name only calls and attributes that appear in the snippet
      kind: requirement
  context_documents:
    - document_id: DOC_excerpt_api
      title: Snippet under review
      content: |
        import httpx

        def fetch_profile(client, user_id):
            response = client.get(f"/users/{user_id}")
            return response.json()
  tags: [code_comprehension, fabrication]

# MQC_REQ_MDL_GND_0001, case 30030. THE FUNCTION NAME INVITES THE FABRICATION.
# It is called top_scorers and never sorts, so a summary calling it one
# that returns the highest scorers is drawn from the name, not the code.
- task_id: MQC_TASK_cod_behaviour_not_intent
  rubric_ids: [MQC_RULE_cod_behaviour_not_intent]
  user_prompt: |
    State what the function below returns when called with rows scoring
    10, 90 and 50 and a limit of two. Describe what it does, not what it
    appears intended to do.
  constraints:
    - constraint_id: COD_BEHAVIOUR_NOT_INTENT
      text: Describe what the code does rather than what it appears intended to do
      kind: requirement
  context_documents:
    - document_id: DOC_excerpt_top_scorers_logical
      title: Excerpt under review
      content: |
        def top_scorers(entries, limit):
            sorted(entries, key=lambda row: row["score"], reverse=True)
            return entries[:limit]
  tags: [code_comprehension, intent]

