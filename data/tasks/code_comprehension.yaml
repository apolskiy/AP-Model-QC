# MQC_REQ_MDL_DEF_0001 and 0002, cases 30038 and 30039. CAUSE AND REMEDY,
# which 30036 never asked for. That case lists the three OUTCOMES, and all
# three follow from one cause, so a model naming them scores the same as
# one that diagnosed the arithmetic.
#
# THE CALL SET IS WIDER HERE, DELIBERATELY. SAVE90 still settles below zero
# once the inverted discount is corrected, which is what makes the missing
# bound a SECOND defect rather than a symptom of the first. 30036's three
# calls cannot separate them.
- task_id: MQC_TASK_cod_settlement_causes
  rubric_ids: [MQC_RULE_cod_settlement_causes]
  user_prompt: |
    The function below settles an order incorrectly. State the cause of
    each defect rather than only what it returns, and say what the
    function should do instead.

    A discount is a percentage of the total. A coupon code is looked up
    to a currency amount, so the two are different units.

    It is called in production like this, against a 100 unit basket:

    settle_order("standard", 100, ["SAVE30"], {"SAVE30": 30})
    settle_order("standard", 100, ["SAVE90"], {"SAVE90": 90})
    settle_order("standard", 100, ["NOPE"], {"SAVE30": 30})
    settle_order("standard", 100, ["SAVE20", "SAVE30"],
                 {"SAVE20": 20, "SAVE30": 30})
  constraints:
    - constraint_id: COD_STATE_CAUSE_AND_REMEDY
      text: State the cause of each defect and what the function should do instead
      kind: requirement
  context_documents:
    - document_id: DOC_excerpt_settle_order
      title: Excerpt under review
      content: |
        DISCOUNT_BY_TIER = {"standard": 20, "premium": 30}

        def settle_order(account_tier, total_amount, coupon_codes, coupon_lookup):
            discount = DISCOUNT_BY_TIER[account_tier]
            coupon_sum = coupon_lookup[coupon_codes[0]]
            amount_owed = total_amount * discount / 100 - coupon_sum
            return amount_owed
  tags: [code_comprehension, logical, diagnosis]

# MQC_REQ_MDL_DEF_0003, case 30040. P4, AND A RECOMMENDATION RATHER THAN A
# DEFECT. Nothing in the module bounds how long a code stays redeemable,
# so every code issued works forever. That is a design weakness a good
# review raises and not an error in what the code does, which is why it is
# informational and cannot turn a run red on its own.
- task_id: MQC_TASK_cod_coupon_lifetime
  rubric_ids: [MQC_RULE_cod_coupon_lifetime]
  user_prompt: |
    The module below redeems coupon codes by looking them up. Nothing in
    it limits how long a code stays redeemable, so every code ever issued
    remains valid indefinitely.

    Recommend how the design should bound a code's lifetime, and say what
    the lookup would have to carry for that bound to be enforceable.
  constraints:
    - constraint_id: COD_BOUND_COUPON_LIFETIME
      text: Recommend a bound on how long a coupon code stays redeemable
      kind: requirement
  context_documents:
    - document_id: DOC_excerpt_settle_order
      title: Excerpt under review
      content: |
        DISCOUNT_BY_TIER = {"standard": 20, "premium": 30}

        def settle_order(account_tier, total_amount, coupon_codes, coupon_lookup):
            discount = DISCOUNT_BY_TIER[account_tier]
            coupon_sum = coupon_lookup[coupon_codes[0]]
            amount_owed = total_amount * discount / 100 - coupon_sum
            return amount_owed
  tags: [code_comprehension, logical, recommendation]

