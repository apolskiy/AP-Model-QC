# MQC_REQ_MDL_GND_0002, case 30033. THE DISCOUNT TIERS MUST SURVIVE A REWRITE.
# This is the discount-on-discount excerpt: the coupon is subtracted from
# the discount figure rather than from the remaining total.
- task_id: MQC_TASK_cod_preserves_discount_tiers
  rubric_ids: [MQC_RULE_cod_preserves_discount_tiers]
  user_prompt: |
    The function below settles an order incorrectly. Explain what it
    computes and what it should compute. Do not change the discount
    percentages the module states.
  constraints:
    - constraint_id: COD_PRESERVE_TIERS
      text: Do not change the stated discount percentages
      kind: prohibition
  context_documents:
    - document_id: DOC_excerpt_settle_order
      title: Excerpt under review
      content: |
        DISCOUNT_BY_TIER = {"standard": 20, "premium": 30}

        def settle_order(account_tier, total_amount, coupon_codes, coupon_lookup):
            discount = DISCOUNT_BY_TIER[account_tier]
            coupon_sum = coupon_lookup[coupon_codes[0]]
            amount_owed = total_amount * discount / 100 - coupon_sum
            return amount_owed
  tags: [code_comprehension, logical, preservation]

