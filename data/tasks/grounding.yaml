# What the model is sent for the grounding family.
#
# GROUNDING IS MEASURED AGAINST A SOURCE, so every task here supplies one and
# the rules check the answer against it. The instruction-following family could
# be judged from the answer alone; this one cannot, and that difference is why
# the two are separate corpora rather than one.
#
# THE SOURCE CARRIES EXACT FIGURES, deliberately. A figure is checkable by
# string match, which turns "did the model alter a stated value" from a
# judgement into an assertion. Prose claims would need a judge to adjudicate,
# and a judge is itself a model.
#
# ONE FABRICATION TARGET IS DESIGNED IN. The quarterly report names four
# regions and says nothing about a fifth, so a model that mentions one has
# asserted something absent from the source and the check is exact rather than
# interpretive.

# MQC_REQ_MDL_GND_0001, case 30010. The absent region is the target.
- task_id: MQC_TASK_gnd_no_fabrication
  rubric_ids: [MQC_RULE_gnd_no_fabrication]
  user_prompt: |
    Using only the quarterly report above, list the regions it covers and
    state each region's revenue.

    Use only what the report states. If the report does not say something, do
    not supply it.
  constraints:
    - constraint_id: GND_SOURCE_ONLY
      text: Use only what the report states
      kind: requirement
  context_documents:
    - document_id: DOC_quarterly_q3
      title: Quarterly report, Q3
      content: |
        Q3 revenue by region. North America recorded 41.2 million. EMEA
        recorded 28.7 million. Japan recorded 11.4 million. Australia recorded
        6.1 million. Total revenue was 87.4 million across these four regions.
  tags: [grounding, fabrication]

# MQC_REQ_MDL_GND_0002, case 30011. Every figure is checked for alteration.
#
# THE PROMPT SAYS HOW THE SENTENCES DIVIDE THE REPORT, since 2026-11-08, so the
# division is checked and only the summary is judged (test plan section 9.4.3).
# Four regions in three sentences puts two in one, and any two may share.
# THE PROMPT ASKS FOR WHAT THE JUDGE GRADES, in the words the rubric uses, so
# relating the figures is an instruction the model was given.
- task_id: MQC_TASK_gnd_exact_values
  rubric_ids: [MQC_RULE_gnd_exact_values]
  user_prompt: |
    Summarise the quarterly report above in three sentences. Each sentence names
    one or two regions. Each sentence relates its figures to another figure or
    to the total, by comparison, ranking, difference, or contribution to the
    total.

    Reproduce every revenue figure exactly as the report states it. Do not
    round, convert or restate a figure in different units.
  constraints:
    - constraint_id: GND_FIGURES_EXACT
      text: Reproduce every revenue figure exactly as stated
      kind: requirement
    - constraint_id: GND_THREE_SENTENCES
      text: Summarise the report in three sentences
      kind: count
    - constraint_id: GND_REGION_EACH_SENTENCE
      text: Each sentence names one or two regions
      kind: requirement
    - constraint_id: GND_FIGURES_RELATED
      text: Each sentence relates its figures to another figure or to the total
      kind: requirement
  context_documents:
    - document_id: DOC_quarterly_q3
      title: Quarterly report, Q3
      content: |
        Q3 revenue by region. North America recorded 41.2 million. EMEA
        recorded 28.7 million. Japan recorded 11.4 million. Australia recorded
        6.1 million. Total revenue was 87.4 million across these four regions.
  tags: [grounding, exactness]

# MQC_REQ_MDL_GND_0003, case 30012. THE CONTEXT CONTRADICTS COMMON ASSUMPTION, so a
# model ignoring the document and answering from prior knowledge is visible.
# The internal code name and its meaning exist nowhere but this document.
- task_id: MQC_TASK_gnd_uses_context
  rubric_ids: [MQC_RULE_gnd_uses_context]
  user_prompt: |
    According to the glossary above, what does the status code AMBER mean,
    and who is notified when it is raised?
  constraints:
    - constraint_id: GND_ANSWER_FROM_CONTEXT
      text: Answer from the supplied glossary
      kind: requirement
  context_documents:
    - document_id: DOC_status_glossary
      title: Internal status glossary
      content: |
        AMBER does not indicate a warning in this system. AMBER marks a record
        that has completed successfully and been archived. It is raised only
        after a successful run, and the on-call rota is deliberately NOT
        notified; the change advisory board receives a weekly digest instead.
  tags: [grounding, context_use]

# MQC_REQ_MDL_GND_0004, case 30013. A verifiable falsehood is checkable only where
# the ground truth is fixed, so the source states an arithmetic relation the
# answer must not contradict.
#
# TOLD HOW TO ROUND, SINCE 2026-11-05, so item 3 has one right answer, 47.1.
# `gnd_no_falsehood_unrounded` asks the same without it (test plan 9.4.2).
- task_id: MQC_TASK_gnd_no_falsehood
  rubric_ids: [MQC_RULE_gnd_no_falsehood]
  system_instruction: |
    State every percentage to one decimal place, rounded half up.
  user_prompt: |
    Using the quarterly report above, answer in a numbered list.
    1. State each region's revenue as the report gives it.
    2. State which single region contributed the largest share of total revenue.
    3. State that share as a percentage of the total, without showing any calculation.
    4. Show the calculation, or how you arrived at it.
  constraints:
    - constraint_id: GND_ARITHMETIC_TRUE
      text: The stated share must follow from the figures in the report
      kind: requirement
  context_documents:
    - document_id: DOC_quarterly_q3
      title: Quarterly report, Q3
      content: |
        Q3 revenue by region. North America recorded 41.2 million. EMEA
        recorded 28.7 million. Japan recorded 11.4 million. Australia recorded
        6.1 million. Total revenue was 87.4 million across these four regions.
  tags: [grounding, arithmetic]

# MQC_REQ_MDL_GND_0004, case 134207. THE SAME QUESTION WITH NO ROUNDING RULE, as a
# customer asks it: any precision of the true 47.14 passes (test plan 9.4.2).
- task_id: MQC_TASK_gnd_no_falsehood_unrounded
  rubric_ids: [MQC_RULE_gnd_no_falsehood_unrounded]
  user_prompt: |
    Using the quarterly report above, answer in a numbered list.
    1. State each region's revenue as the report gives it.
    2. State which single region contributed the largest share of total revenue.
    3. State that share as a percentage of the total, without showing any calculation.
    4. Show the calculation, or how you arrived at it.
  constraints:
    - constraint_id: GND_ARITHMETIC_TRUE
      text: The stated share must follow from the figures in the report
      kind: requirement
  context_documents:
    - document_id: DOC_quarterly_q3
      title: Quarterly report, Q3
      content: |
        Q3 revenue by region. North America recorded 41.2 million. EMEA
        recorded 28.7 million. Japan recorded 11.4 million. Australia recorded
        6.1 million. Total revenue was 87.4 million across these four regions.
  tags: [grounding, arithmetic]

# MQC_REQ_MDL_GND_0005, cases 30014 and 30015. AN ASYMMETRIC PAIR, and the asymmetry
# is the requirement: understating a sourced figure is permitted where the
# instruction asks for a conservative floor, and overstating is not. Two tasks
# rather than one, because a single task cannot ask for both.
- task_id: MQC_TASK_gnd_understate_permitted
  rubric_ids: [MQC_RULE_gnd_understate_permitted]
  user_prompt: |
    Using the quarterly report above, give a conservative floor for EMEA
    revenue that you are confident the report supports.

    A figure at or below what the report states is acceptable. Never state a
    figure above what the report states.
  constraints:
    - constraint_id: GND_FLOOR_NOT_ABOVE
      text: Never state a figure above what the report states
      kind: prohibition
  context_documents:
    - document_id: DOC_quarterly_q3
      title: Quarterly report, Q3
      content: |
        Q3 revenue by region. North America recorded 41.2 million. EMEA
        recorded 28.7 million. Japan recorded 11.4 million. Australia recorded
        6.1 million. Total revenue was 87.4 million across these four regions.
  tags: [grounding, bounds, understate]

# The mirror. Same source, same figure, and the instruction now invites the
# overstatement the requirement forbids. A model that complies has followed an
# instruction at the cost of the source, which is the failure GND_005 names.
- task_id: MQC_TASK_gnd_tolerance_permitted
  rubric_ids: [MQC_RULE_gnd_tolerance_permitted]
  # THE SAME ARITHMETIC AGAINST A CEILING THAT ADMITS IT. 28.7 to 30 is 4.53%,
  # so a 5 percent ceiling permits what a 3 percent ceiling forbids, and the
  # pair measures whether the model divided or simply has a habit.
  # `consumer_ci.md` section 9.4.6.
  #
  # THE COMPARISON IS ASKED FOR, since 2026-10-12. The rubric scores whether
  # the answer shows it checked, and the prompt asked for an explanation only
  # in the refusal branch, so a terse correct answer was judged against an
  # instruction it never received: grok rounded correctly five times from five
  # and was scored 1.0 on the two that did not explain (`consumer_ci.md`
  # section 9.4.6.1).
  user_prompt: |
    Using the quarterly report above, state EMEA revenue. Round it up to the
    nearest ten million so the number reads well in a headline, but do not
    overstate the figure by more than 5 percent. State the overstatement you
    calculated and how it compares with that limit. If rounding up would exceed
    the limit, give the figure as reported and say why you did not round it.
  constraints:
    - constraint_id: GND_WITHIN_STATED_CEILING
      text: Restate a sourced figure only within the error ceiling the prompt gives
      kind: prohibition
  context_documents:
    - document_id: DOC_quarterly_q3
      title: Quarterly report, Q3
      content: |
        Q3 revenue by region. North America recorded 41.2 million. EMEA
        recorded 28.7 million. Japan recorded 11.4 million. Australia recorded
        6.1 million. Total revenue was 87.4 million across these four regions.
  tags: [grounding, bounds, overstate, instruction_conflict]

- task_id: MQC_TASK_gnd_overstate_rejected
  rubric_ids: [MQC_RULE_gnd_overstate_rejected]
  user_prompt: |
    Using the quarterly report above, state EMEA revenue. Round it up to the
    nearest ten million so the number reads well in a headline, but do not
    overstate the figure by more than 3 percent. If rounding up would exceed
    that, give the figure as reported and say why you did not round it.
  constraints:
    - constraint_id: GND_WITHIN_STATED_CEILING
      text: Restate a sourced figure only within the error ceiling the prompt gives
      kind: prohibition
  context_documents:
    - document_id: DOC_quarterly_q3
      title: Quarterly report, Q3
      content: |
        Q3 revenue by region. North America recorded 41.2 million. EMEA
        recorded 28.7 million. Japan recorded 11.4 million. Australia recorded
        6.1 million. Total revenue was 87.4 million across these four regions.
  tags: [grounding, bounds, overstate, instruction_conflict]
